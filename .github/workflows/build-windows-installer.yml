name: Build Windows Desktop Installer

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-installer:
    name: Build Standalone Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Inno Setup
        run: |
          choco install innosetup -y --no-progress

      - name: Upgrade Pip & Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Download & Pre-Bundle U2Net AI Model for 100% Offline Use
        run: |
          mkdir models -ErrorAction SilentlyContinue
          python -c "import urllib.request; print('Downloading U2Net weights...'); urllib.request.urlretrieve('https://github.com/danielgatis/rembg/releases/download/v0.0.0/u2net.onnx', 'models/u2net.onnx'); print('U2Net weights successfully downloaded to models/u2net.onnx')"

      - name: Build Desktop Application with PyInstaller
        run: |
          pyinstaller --noconfirm --clean BulkBackgroundRemover.spec

      - name: Verify PyInstaller Build Output
        run: |
          if (-not (Test-Path "dist\BulkBackgroundRemover\BulkBackgroundRemover.exe")) {
            Write-Error "PyInstaller binary BulkBackgroundRemover.exe was not generated."
            exit 1
          }
          Write-Host "PyInstaller application output verified successfully."

      - name: Compile Windows Installer with Inno Setup
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Verify Installer Artifact
        run: |
          if (-not (Test-Path "dist_installer\BulkBackgroundRemover_Setup.exe")) {
            Write-Error "Installer executable dist_installer\BulkBackgroundRemover_Setup.exe was not created."
            exit 1
          }
          Write-Host "Windows Installer generated successfully: dist_installer\BulkBackgroundRemover_Setup.exe"

      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BulkBackgroundRemover_Setup
          path: dist_installer/BulkBackgroundRemover_Setup.exe
          if-no-files-found: error
          retention-days: 30
